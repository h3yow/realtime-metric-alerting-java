server.port=0

# ===== 实时指标与告警本地配置 =====
# 窗口大小（毫秒），默认 60s
alerting.window-millis=60000
# 窗口数据保留时长（毫秒），默认 1h，超时窗口由定时任务清理
alerting.retention-millis=3600000
# 允许的时钟前偏：超过当前时间多少毫秒视为非法未来数据并拒绝
alerting.max-future-millis=5000
# 允许的迟到范围：早于当前时间多久视为明显过期并拒绝
alerting.max-late-millis=3600000
# 写入后是否自动评估匹配规则
alerting.auto-evaluate=true
# 过期窗口清理周期（毫秒）
alerting.purge-fixed-delay-ms=60000
